
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0d">
<title>Camera Experience</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #090a0d;
  --silver: #aeb2b7;
  --camera: #17191c;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 42%, #24282e 0%, #111317 40%, #070809 100%);
  color: white;
  font-family: Arial, sans-serif;
}

.scene {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  perspective: 1100px;
  position: relative;
  overflow: hidden;
}

.scene::before {
  content: "";
  position: absolute;
  width: 650px;
  height: 650px;
  background: radial-gradient(
    circle,
    rgba(160,175,195,.10),
    transparent 68%
  );
  pointer-events: none;
}

.ambient {
  position: absolute;
  width: 320px;
  height: 10px;
  bottom: 19%;
  border-radius: 50%;
  background: #000;
  filter: blur(24px);
  opacity: .9;
}


.camera {
  position: relative;
  width: min(390px, 88vw);
  height: 235px;
  border-radius: 23px 23px 18px 18px;
  background:
    linear-gradient(145deg, #42464c 0%, #24272b 15%, #111316 55%, #292c30 100%);
  border: 2px solid #51555b;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.23),
    inset 0 -9px 15px rgba(0,0,0,.8),
    0 35px 50px rgba(0,0,0,.7),
    0 5px 15px rgba(0,0,0,.8);
}


.top {
  position: absolute;
  top: -24px;
  left: 60px;
  width: 265px;
  height: 27px;
  border-radius: 12px 12px 3px 3px;
  background: linear-gradient(180deg,#60646a,#25282d 55%,#101113);
  border: 1px solid #6b6e72;
  box-shadow: 0 -4px 9px rgba(255,255,255,.08);
}

.viewfinder {
  position: absolute;
  top: -17px;
  left: 155px;
  width: 75px;
  height: 25px;
  border-radius: 8px 8px 2px 2px;
  background: linear-gradient(135deg,#555b62,#15171a);
  border: 2px solid #777b80;
}

.viewfinder::after {
  content: "";
  position: absolute;
  top: 5px;
  left: 16px;
  width: 38px;
  height: 8px;
  border-radius: 3px;
  background: linear-gradient(90deg,#050709,#35404a,#050709);
}


.flash-unit {
  position: absolute;
  top: 18px;
  left: 154px;
  width: 82px;
  height: 33px;
  border-radius: 5px;
  background: linear-gradient(180deg,#d1d5d9,#747a80 40%,#282b30);
  border: 1px solid #777e85;
  box-shadow: inset 0 2px 5px white;
}

.flash-unit::after {
  content: "";
  position: absolute;
  inset: 7px 12px;
  background: linear-gradient(90deg,#dceaff,#fff,#c7e0ff);
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(200,225,255,.5);
}


.brand {
  position: absolute;
  top: 64px;
  left: 22px;
  font-size: 12px;
  letter-spacing: 4px;
  font-weight: 800;
  color: #d0d1d3;
  text-shadow: 0 1px 2px black;
}

.model {
  position: absolute;
  top: 83px;
  left: 23px;
  color: #858a90;
  font-size: 7px;
  letter-spacing: 2px;
}


.grip {
  position: absolute;
  left: 0;
  top: 24px;
  height: 188px;
  width: 49px;
  border-radius: 20px 5px 5px 16px;
  background: linear-gradient(90deg,#090a0c,#282b30,#15171a);
  border-right: 2px solid #42464b;
}

.grip::after {
  content: "";
  position: absolute;
  inset: 15px 8px;
  border-radius: 7px;
  background: repeating-linear-gradient(
    180deg,
    rgba(255,255,255,.035) 0px,
    rgba(255,255,255,.035) 2px,
    transparent 2px,
    transparent 5px
  );
}


.lens {
  position: absolute;
  left: 50%;
  top: 54%;
  width: 205px;
  height: 205px;
  transform: translate(-50%,-50%) translateZ(25px);
  border-radius: 50%;
  background:
    radial-gradient(circle at 40% 35%,#545b62 0%,#171a1e 27%,#07090b 64%);
  border: 7px solid #34383e;
  box-shadow:
    0 0 0 3px #858a90,
    0 0 0 7px #181a1e,
    0 10px 24px rgba(0,0,0,.9),
    inset 0 0 15px #000;
}

.lens::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  border: 4px solid #858a8e;
  box-shadow:
    inset 0 0 9px #000,
    0 0 4px rgba(255,255,255,.25);
}

.lens::after {
  content: "";
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  border: 2px solid #292e34;
}

.lens-glass {
  position: absolute;
  inset: 29px;
  border-radius: 50%;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 34% 27%,
      rgba(130,180,210,.5),
      transparent 20%),
    radial-gradient(ellipse at 65% 70%,
      rgba(40,90,150,.2),
      transparent 35%),
    radial-gradient(circle,
      #03070e 0%,
      #0b1727 30%,
      #10151d 55%,
      #050609 76%);
  box-shadow: inset 0 0 20px #000;
}

.lens-glass::before {
  content: "";
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  border: 3px solid rgba(160,170,180,.25);
  box-shadow: 0 0 12px rgba(120,180,255,.1);
}

.lens-glass::after {
  content: "";
  position: absolute;
  top: 12%;
  left: 18%;
  width: 35%;
  height: 13%;
  transform: rotate(-42deg);
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  filter: blur(3px);
}

.lens-center {
  position: absolute;
  inset: 36%;
  border-radius: 50%;
  background: radial-gradient(circle,#020306,#101d30 50%,#020306 75%);
  border: 2px solid rgba(120,150,180,.35);
}

.lens-text {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 6px;
  letter-spacing: 2px;
  color: #a9afb5;
  white-space: nowrap;
}


.side-button {
  position: absolute;
  right: 15px;
  top: 73px;
  width: 24px;
  height: 12px;
  border-radius: 3px;
  background: linear-gradient(#71767d,#25282d);
  border: 1px solid #777;
}

.screen-detail {
  position: absolute;
  right: 18px;
  bottom: 26px;
  width: 53px;
  height: 34px;
  border-radius: 4px;
  background: linear-gradient(135deg,#242c34,#080b0e);
  border: 2px solid #666c73;
  box-shadow: inset 0 0 8px black;
}

.dial {
  position: absolute;
  right: 27px;
  top: 35px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: repeating-conic-gradient(#333 0deg 8deg,#111 8deg 16deg);
  border: 3px solid #777;
  box-shadow: 0 2px 5px black;
}


.controls {
  margin-top: 75px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 19px;
  z-index: 5;
}

.shutter {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  border: 5px solid #777d83;
  background: linear-gradient(145deg,#dedede,#6e747b 50%,#24272b);
  box-shadow:
    0 9px 20px #000,
    inset 0 3px 5px white,
    0 0 0 5px #202328;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform .12s, filter .2s;
  -webkit-tap-highlight-color: transparent;
}

.shutter-core {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(145deg,#f8f8f8,#b3b7bb 50%,#64696e);
  border: 2px solid #fff;
  box-shadow:
    inset 0 -4px 7px rgba(0,0,0,.25),
    0 2px 4px rgba(0,0,0,.6);
}

.shutter:active,
.shutter.pressed {
  transform: translateY(5px) scale(.96);
  filter: brightness(1.2);
}

.shutter:disabled {
  cursor: wait;
}

.hint {
  font-size: 10px;
  letter-spacing: 4px;
  color: #858b93;
  text-transform: uppercase;
}

.title {
  position: absolute;
  top: 8%;
  text-align: center;
  color: rgba(255,255,255,.8);
  letter-spacing: 6px;
  font-size: 12px;
  font-weight: 300;
}

.title span {
  display: block;
  margin-top: 12px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #777e87;
}


.flash {
  position: fixed;
  inset: 0;
  background: white;
  z-index: 20;
  opacity: 0;
  pointer-events: none;
}

.flash.active {
  animation: cameraFlash .85s ease-out forwards;
}

@keyframes cameraFlash {
  0% { opacity: 0; }
  7% { opacity: 1; }
  28% { opacity: 1; }
  100% { opacity: 0; }
}


.photo-stage {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(8,9,12,.94);
  opacity: 0;
  visibility: hidden;
  transition: opacity .5s, visibility .5s;
  perspective: 1200px;
}

.photo-stage {
  position: fixed;
  inset: 0;
  z-index: 10;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 25px 16px 100px;

  background: rgba(8, 9, 12, .96);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .7s ease,
    visibility .7s ease;

  perspective: 1200px;
  overflow: hidden;
}

.photo-stage.visible {
  opacity: 1;
  visibility: visible;
}


.polaroid {
  width: min(310px, 78vw);

  padding: 12px 12px 48px;

  background: linear-gradient(
    135deg,
    #ffffff,
    #ededed
  );

  box-shadow:
    0 35px 90px rgba(0,0,0,.6),
    0 0 2px rgba(255,255,255,.9);

  transform:
    translate3d(0, 110vh, -100px)
    rotateX(18deg)
    rotateZ(8deg)
    scale(.88);

  opacity: 0;

  filter: blur(5px);

  will-change: transform, opacity, filter;

  transition:
    transform 1.8s cubic-bezier(.16, 1, .3, 1),
    opacity 1.1s ease,
    filter 1.4s ease;
}

.photo-stage.visible .polaroid {
  transform:
    translate3d(0, 0, 0)
    rotateX(0deg)
    rotateZ(-3deg)
    scale(1);

  opacity: 1;
  filter: blur(0);
}

.polaroid img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1.12;
  object-fit: cover;
  background: #d0d0d0;
}


.photo-caption {
  margin-top: 17px;
  text-align: center;
  font-family: "Courier New", monospace;
  font-size: 13px;
  letter-spacing: 2px;
  color: #444;
}


.photo-actions {
  position: absolute;
  bottom: max(7%, env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  padding: 0 15px;
}

.photo-actions button {
  min-height: 44px;
  padding: 13px 20px;
  border: 1px solid rgba(255,255,255,.3);
  background: rgba(255,255,255,.08);
  color: white;
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 2px;
  font-size: 10px;
}

@media (max-width: 380px) {
  .polaroid {
    width: min(270px, 76vw);
  }

  .photo-actions button {
    font-size: 9px;
    padding: 12px 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .polaroid {
    transition-duration: .25s;
  }
}

.scene {
  width: 100%;
  min-height: 100svh;
  min-height: 100dvh;
  padding: 100px 16px 45px;
  gap: 0;
  overflow: hidden;
}

.camera-wrap {
  width: min(390px, 88vw);
  flex-shrink: 0;
}

.camera {
  width: 100%;
  height: auto;
  aspect-ratio: 390 / 235;
}


.lens {
  width: 52.5%;
  height: auto;
  aspect-ratio: 1;
}

.controls {
  margin-top: clamp(55px, 12vh, 90px);
  gap: 20px;
}

.shutter {
  width: clamp(68px, 19vw, 82px);
  height: clamp(68px, 19vw, 82px);
}

.shutter-core {
  width: 70%;
  height: 70%;
}


@media (max-width: 380px) {
  .scene {
    padding-top: 85px;
    padding-bottom: 25px;
  }

  .camera-wrap {
    width: 86vw;
  }

  .controls {
    margin-top: 55px;
  }

  .title {
    font-size: 10px;
    letter-spacing: 4px;
  }

  .title span {
    font-size: 8px;
  }

  .hint {
    font-size: 9px;
    letter-spacing: 3px;
  }
}


@media (min-width: 381px) and (max-width: 600px) {
  .camera-wrap {
    width: min(390px, 88vw);
  }

  .controls {
    margin-top: clamp(55px, 10vh, 80px);
  }
}


@media (min-width: 601px) {
  .camera-wrap {
    width: min(460px, 75vw);
  }

  .camera {
    height: auto;
  }

  .controls {
    margin-top: 85px;
  }
}


@media (max-height: 700px) {
  .scene {
    padding-top: 65px;
    padding-bottom: 15px;
  }

  .controls {
    margin-top: 35px;
  }

  .title {
    top: 3%;
  }
}


@media (max-height: 550px) {
  .scene {
    padding-top: 55px;
    padding-bottom: 10px;
  }

  .camera-wrap {
    width: min(310px, 72vw);
  }

  .controls {
    margin-top: 25px;
  }

  .title {
    display: none;
  }
}

button {
  touch-action: manipulation;
}

</style>
</head>

<body>

<main class="scene">

  <div class="title">
    MOMENTS IN TIME
    <span>CAPTURE SOMETHING BEAUTIFUL</span>
  </div>

  <div class="ambient"></div>

  <div class="camera-wrap">
    <div class="camera">

      <div class="top"></div>
      <div class="viewfinder"></div>
      <div class="flash-unit"></div>

      <div class="grip"></div>

      <div class="brand">DSLR</div>
      <div class="model">DIGITAL CAMERA</div>

      <div class="dial"></div>
      <div class="side-button"></div>
      <div class="screen-detail"></div>

      <div class="lens">
        <div class="lens-glass">
          <div class="lens-center"></div>
        </div>
        <div class="lens-text">50mm 1:1.8 LENS</div>
      </div>

    </div>
  </div>

  <div class="controls">
    <button class="shutter" id="shutter" aria-label="Take photo">
      <div class="shutter-core"></div>
    </button>
    <div class="hint">PRESS TO CAPTURE</div>
  </div>

</main>

<div class="flash" id="flash"></div>

<div class="photo-stage" id="photoStage">

  <div class="polaroid">
    <img id="photo" src="1.png" alt="Captured photograph">
    <div class="photo-caption">A MOMENT TO REMEMBER</div>
  </div>

  <div class="photo-actions">
    <button id="again">TAKE ANOTHER</button>
    <button id="close">CLOSE</button>
  </div>

</div>

<audio id="revealSound" src="./reveal.mp3" preload="auto"></audio>

<script>

const shutter = document.getElementById("shutter");
const flash = document.getElementById("flash");
const stage = document.getElementById("photoStage");
const again = document.getElementById("again");
const close = document.getElementById("close");
const photo = document.getElementById("photo");
const revealSound = document.getElementById("revealSound");

const photos = [
  "1.png",
  "2.png",
  "3.png",
];

let currentPhoto = 0;

function changePhoto() {
  photo.src = photos[currentPhoto];

  currentPhoto++;

  if (currentPhoto >= photos.length) {
    currentPhoto = 0;
  }
}


let busy = false;

function playShutterSound() {
  const AudioContext =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContext) return;

  const ctx = new AudioContext();
  const now = ctx.currentTime;

  const noiseBuffer = ctx.createBuffer(
    1,
    ctx.sampleRate * 0.18,
    ctx.sampleRate
  );

  const data = noiseBuffer.getChannelData(0);

  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) *
      Math.pow(1 - i / data.length, 3);
  }

  const noise = ctx.createBufferSource();
  noise.buffer = noiseBuffer;

  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 1700;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(.35, now);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    now + .16
  );

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  noise.start(now);
  noise.stop(now + .18);

  const osc = ctx.createOscillator();
  const oscGain = ctx.createGain();

  osc.type = "triangle";
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(
    55, now + .07
  );

  oscGain.gain.setValueAtTime(.22, now);
  oscGain.gain.exponentialRampToValueAtTime(
    .001, now + .08
  );

  osc.connect(oscGain);
  oscGain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + .09);

  setTimeout(() => ctx.close(), 500);
}


function capture() {
  if (busy) return;

  busy = true;
  shutter.disabled = true;
  shutter.classList.add("pressed");

  setTimeout(() => {
    shutter.classList.remove("pressed");

    playShutterSound();

    flash.classList.remove("active");
    void flash.offsetWidth;
    flash.classList.add("active");

    setTimeout(() => {

      changePhoto();

      stage.classList.add("visible");

      setTimeout(() => {
        revealSound.currentTime = 0;
        revealSound.play().catch(() => {});
      }, 1200);

      setTimeout(() => {
        shutter.disabled = false;
        busy = false;
      }, 1800);

    }, 450);

  }, 120);
}


function reset() {
  stage.classList.remove("visible");

  setTimeout(() => {
    busy = false;
    shutter.disabled = false;
  }, 600);
}

shutter.addEventListener("click", capture);
again.addEventListener("click", reset);
close.addEventListener("click", reset);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") reset();
});

photo.addEventListener("error", () => {
  console.error("Photo not found. Check your image filename.");
});
</script>

</body>
</html>
